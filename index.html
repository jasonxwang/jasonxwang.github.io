<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare the cost of driving a gas car and an electric car.">
  <title>Jason's Personal Tools</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f6c64'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial, sans-serif' font-size='38' font-weight='800' fill='%23ffffff'%3EJ%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f7f9;
      --panel: #ffffff;
      --ink: #12303b;
      --muted: #5d7580;
      --line: #d4e0e5;
      --gas: #d97b00;
      --ev: #1f6feb;
      --accent: #0f6c64;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(31, 111, 235, 0.10), transparent 32%),
        radial-gradient(circle at 85% 25%, rgba(217, 123, 0, 0.10), transparent 30%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--ev), var(--accent));
      color: white;
      font-size: 18px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: clamp(32px, 7vw, 84px);
      min-height: calc(100vh - 72px);
      padding: 32px 0 72px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 2px;
      background: currentColor;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(42px, 7vw, 78px);
      line-height: 0.97;
      letter-spacing: -0.06em;
    }

    .lead {
      max-width: 620px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border: 2px solid transparent;
      border-radius: 14px;
      color: white;
      background: var(--ev);
      box-shadow: 0 10px 30px rgba(31, 111, 235, 0.22);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button:focus-visible {
      outline: 3px solid rgba(31, 111, 235, 0.30);
      outline-offset: 4px;
    }

    .button.secondary {
      border-color: var(--line);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: none;
    }

    .visual {
      position: relative;
      min-height: 440px;
    }

    .card {
      position: absolute;
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 60px rgba(18, 48, 59, 0.14);
      backdrop-filter: blur(10px);
    }

    .card.gas { top: 50px; right: 50px; transform: rotate(3deg); }
    .card.ev { bottom: 28px; left: 10px; transform: rotate(-3deg); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 800;
    }

    .chip {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .chip.gas { color: #8a4700; background: #fff0d9; }
    .chip.ev { color: #104db7; background: #e8f0ff; }

    .metric {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }

    .metric:first-of-type { border-top: 0; }

    .metric strong {
      display: block;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .metric span { color: var(--muted); font-size: 14px; }

    .meter {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf3f5;
    }

    .meter > span {
      display: block;
      height: 100%;
      border-radius: inherit;
    }

    .meter .gas { width: 70%; background: var(--gas); }
    .meter .ev { width: 40%; background: var(--ev); }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 28px;
      }

      .visual {
        min-height: 380px;
      }

      .card.gas { right: 20px; }
    }

    @media (max-width: 480px) {
      .page { width: min(100% - 24px, 1120px); }
      .topbar { min-height: 60px; }
      .hero { padding-bottom: 48px; }
      .visual { min-height: 320px; }
      .card { padding: 22px; border-radius: 18px; }
      .card.gas { top: 0; right: 0; }
      .card.ev { left: 0; bottom: 0; }
      .metric strong { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Jason's homepage">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span>Jason's tools</span>
      </a>
    </header>

    <main class="hero">
      <section>
        <div class="eyebrow">Personal cost tools</div>
        <h1>See which car costs less to drive.</h1>
        <p class="lead">Compare your fuel costs, electricity rates, annual mileage, and vehicle efficiency in one simple calculator.</p>
        <div class="actions">
          <a class="button" href="gas-vs-ev-cost-calculator.html">Open the calculator</a>
          <a class="button secondary" href="https://github.com/jasonxwang/jasonxwang.github.io" target="_blank" rel="noreferrer">View source</a>
        </div>
      </section>

      <section class="visual" aria-label="Vehicle cost comparison preview">
        <article class="card gas">
          <div class="card-header">
            <span>Gas car</span>
            <span class="chip gas">$0.37/mi</span>
          </div>
          <div class="metric">
            <div>
              <strong>$0.37</strong>
              <span>per mile</span>
            </div>
            <div class="meter" aria-hidden="true"><span class="gas"></span></div>
          </div>
        </article>

        <article class="card ev">
          <div class="card-header">
            <span>Electric car</span>
            <span class="chip ev">$0.21/mi</span>
          </div>
          <div class="metric">
            <div>
              <strong>$0.21</strong>
              <span>per mile</span>
            </div>
            <div class="meter" aria-hidden="true"><span class="ev"></span></div>
          </div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
